<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestão de Fornecedores</title>
    <style>
        /* Remove margens e garante altura total */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* Evita barra de rolagem dupla */
            background-color: #f4f6f8; /* Mesma cor de fundo do seu app */
        }
        
        /* O iframe ocupa tudo */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <iframe src="https://script.google.com/macros/s/AKfycbzxp7sZjcLzZtLO8hwwAgcaGc9p90a88pUbAv3e0AQ3IGeOMymgHtdthndKv9vXI-ZI6g/exec"></iframe>
</body>
</html>
