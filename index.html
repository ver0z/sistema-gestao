<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f8; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #login-screen { text-align: center; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        input { padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 10px; width: 200px; }
        button { padding: 10px 20px; background: #0b5394; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #094276; }
        iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; display: none; z-index: 10; background: #fff; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2 style="color:#0b5394;">🔐 Sistema Financeiro</h2>
        <p>Digite a senha de acesso:</p>
        <input type="password" id="senhaInput" placeholder="Senha">
        <br>
        <button onclick="verificar()">Entrar</button>
        <p id="msg" style="color:red; font-size:12px; margin-top:10px;"></p>
    </div>

    <iframe id="sistemaFrame" src=""></iframe>

    <script>
        // --- CONFIGURAÇÃO ---
        const SENHA_CORRETA = "1234"; // Defina sua senha aqui
        const URL_DO_APP = "https://script.google.com/macros/s/SEU_ID_DO_SCRIPT/exec"; 
        // --------------------

        function verificar() {
            const digitado = document.getElementById('senhaInput').value;
            if (digitado === SENHA_CORRETA) {
                // Se a senha estiver certa, carrega o iframe e esconde o login
                const frame = document.getElementById('sistemaFrame');
                frame.src = URL_DO_APP;
                frame.style.display = 'block';
                document.getElementById('login-screen').style.display = 'none';
            } else {
                document.getElementById('msg').innerText = "Senha incorreta.";
            }
        }

        // Permite apertar Enter para entrar
        document.getElementById('senhaInput').addEventListener("keypress", function(event) {
            if (event.key === "Enter") verificar();
        });
    </script>

</body>
</html>
